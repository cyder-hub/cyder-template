services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cyder_template
      POSTGRES_USER: cyder_template
      POSTGRES_PASSWORD: cyder_template_dev
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - cyder-template-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyder-template:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgres://cyder_template:cyder_template_dev@postgres:5432/cyder_template
    ports:
      - "8000:8000"
    volumes:
      - cyder-template-data:/data

volumes:
  cyder-template-data:
  cyder-template-postgres-data:
