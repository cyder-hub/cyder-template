[package]
name = "cyder-music"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
default-run = "cyder-music"

[[bin]]
name = "cyder-music"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
config = { version = "0.15.25", features = ["yaml"] }
diesel = { version = "2.3.12", features = ["postgres", "returning_clauses_for_sqlite_3_35", "sqlite"] }
diesel-async = { version = "0.9.2", features = ["bb8", "migrations", "pool", "postgres", "sqlite"] }
diesel_migrations = "2.3.2"
http-body = "1.1.0"
libsqlite3-sys = { version = "0.37.0", features = ["bundled"] }
pq-sys = { version = "0.7.5", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-postgres = "0.7.18"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "fs", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
