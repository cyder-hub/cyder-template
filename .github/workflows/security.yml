name: Security

on:
  pull_request:
  push:
    branches: ["main", "master"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency policy and advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Validate security exceptions
        run: node scripts/validate-security-exceptions.mjs

      - name: Check Rust dependency policy and advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, cargo-deny 0.20.2
        with:
          rust-version: "1.94.0"
          arguments: --locked

      - name: Audit locked frontend dependencies
        run: npm --prefix front audit --package-lock-only --audit-level=high
