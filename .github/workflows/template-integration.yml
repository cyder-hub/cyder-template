name: Template Integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  template-integration:
    name: Full Template Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Activate pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - name: Install native build dependencies when missing
        shell: bash
        run: |
          if ! dpkg -s libssl-dev pkg-config >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
          fi

      - name: Restore integration cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/template-project-integration
          key: ${{ runner.os }}-template-integration-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-template-integration-

      - name: Install just 1.58.0
        run: cargo install --locked just --version 1.58.0

      - name: Test initialized project variants
        env:
          DEV_TEMPLATE_INTEGRATION: "1"
        run: node --test scripts/template-project.test.mjs
