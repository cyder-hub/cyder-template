name: CI

on:
  pull_request:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Activate pinned Rust toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # template-init:start
      - name: Set up pinned Node for template initialization
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Initialize clean project
        env:
          DEV_TEMPLATE_INIT_ANSWERS: >-
            {"projectSlug":"ci-service","displayName":"CI Service","githubRepository":"cyder-hub/ci-service","runCheck":false,"confirm":true}
        run: |
          answers_file="${RUNNER_TEMP}/template-init-answers.json"
          printf '%s\n' "${DEV_TEMPLATE_INIT_ANSWERS}" > "${answers_file}"
          node scripts/init-project.mjs --answers-file "${answers_file}"
      # template-init:end

      - name: Install native build dependencies
        shell: bash
        run: |
          if ! dpkg -s libssl-dev pkg-config >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get install -y --no-install-recommends libssl-dev pkg-config
          fi

      - name: Cache cargo artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint backend
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test backend
        run: cargo test --workspace --locked

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Test toolchain and bootstrap contracts
        working-directory: .
        run: node --test scripts/toolchain.test.mjs

      # template-init:start
      - name: Test template initialization contract
        working-directory: .
        run: node --test scripts/template-project.test.mjs

      - name: Initialize clean project
        working-directory: .
        env:
          DEV_TEMPLATE_INIT_ANSWERS: >-
            {"projectSlug":"ci-service","displayName":"CI Service","githubRepository":"cyder-hub/ci-service","runCheck":false,"confirm":true}
        run: |
          answers_file="${RUNNER_TEMP}/template-init-answers.json"
          printf '%s\n' "${DEV_TEMPLATE_INIT_ANSWERS}" > "${answers_file}"
          node scripts/init-project.mjs --answers-file "${answers_file}"
      # template-init:end

      - name: Install dependencies
        run: npm ci

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Type check frontend
        run: npm run typecheck

      - name: Test frontend with coverage
        run: npm test

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: front/package-lock.json

      # template-init:start
      - name: Activate pinned Rust toolchain for template initialization
        shell: bash
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version

      - name: Initialize clean project
        env:
          DEV_TEMPLATE_INIT_ANSWERS: >-
            {"projectSlug":"ci-service","displayName":"CI Service","githubRepository":"cyder-hub/ci-service","runCheck":false,"confirm":true}
        run: |
          answers_file="${RUNNER_TEMP}/template-init-answers.json"
          printf '%s\n' "${DEV_TEMPLATE_INIT_ANSWERS}" > "${answers_file}"
          node scripts/init-project.mjs --answers-file "${answers_file}"
      # template-init:end

      - name: Validate compose file
        run: docker compose -f docker-compose.yml config

      - name: Build image
        run: docker build -t cyder-template:ci -f Dockerfile .

      - name: Test container configuration contract
        run: bash scripts/test-container-config.sh cyder-template:ci

      - name: Test container HTTP and static-asset contract
        run: bash scripts/test-container-http.sh cyder-template:ci

      - name: Install frontend E2E dependencies
        run: npm --prefix front ci

      - name: Install pinned Chromium
        run: npm --prefix front exec -- playwright install --with-deps chromium

      - name: Test initialized image browser path
        run: bash scripts/test-container-e2e.sh cyder-template:ci

      - name: Upload initialized image E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: initialized-image-e2e-${{ github.run_attempt }}
          path: |
            front/playwright-report
            front/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Test graceful container shutdown
        run: bash scripts/test-container-shutdown.sh cyder-template:ci

  # template-init:start
  template-frontend-e2e:
    name: Template Frontend and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm --prefix front ci

      - name: Check frontend formatting
        run: npm --prefix front run format:check

      - name: Lint frontend
        run: npm --prefix front run lint

      - name: Type check frontend
        run: npm --prefix front run typecheck

      - name: Test frontend with coverage
        run: npm --prefix front test

      - name: Build frontend
        run: npm --prefix front run build

      - name: Install pinned Chromium
        run: npm --prefix front exec -- playwright install --with-deps chromium

      - name: Build template image
        run: docker build -t cyder-template:template-ci -f Dockerfile .

      - name: Test template image browser CRUD path
        run: bash scripts/test-container-e2e.sh cyder-template:template-ci

      - name: Upload template image E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: template-image-e2e-${{ github.run_attempt }}
          path: |
            front/playwright-report
            front/test-results
          if-no-files-found: ignore
          retention-days: 7
  # template-init:end
